version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: url-shortener-postgres-dev
    restart: unless-stopped
    environment:
      POSTGRES_DB: url_shortener
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - '5432:5432'
    volumes:
      - postgres_dev_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres']
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: url-shortener-redis-dev
    restart: unless-stopped
    ports:
      - '6379:6379'
    volumes:
      - redis_dev_data:/data

  backend:
    build:
      context: .
      dockerfile: Dockerfile
      target: development
    container_name: url-shortener-backend-dev
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      NODE_ENV: development
      PORT: 4000
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/url_shortener?schema=public
      REDIS_URL: redis://redis:6379
      JWT_ACCESS_SECRET: dev-access-secret
      JWT_REFRESH_SECRET: dev-refresh-secret
      JWT_ACCESS_EXPIRES_IN: 15m
      JWT_REFRESH_EXPIRES_IN: 7d
      BCRYPT_SALT_ROUNDS: 10
      CLIENT_URL: http://localhost:5173
      CORS_ORIGINS: http://localhost:5173,http://localhost:3000
      BASE_URL: http://localhost:4000
      SHORT_CODE_LENGTH: 6
    ports:
      - '4000:4000'
      - '9229:9229'
    volumes:
      - ./backend/src:/app/backend/src
      - ./backend/prisma:/app/backend/prisma
    command: npm run dev

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
      target: development
    container_name: url-shortener-frontend-dev
    restart: unless-stopped
    depends_on:
      - backend
    environment:
      VITE_API_URL: http://localhost:4000
    ports:
      - '5173:5173'
    volumes:
      - ./frontend/src:/app/frontend/src
    command: npm run dev -- --host

volumes:
  postgres_dev_data:
  redis_dev_data:
